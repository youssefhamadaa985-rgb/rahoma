<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>عيد ميلاد رحومتي ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Cairo',sans-serif;background:#fff1f2;color:#374151}body{overflow-x:hidden}
button{font-family:inherit;border:0;cursor:pointer}.app{min-height:100vh;background:linear-gradient(to bottom,#fff1f2,#fdf2f8,#fffbeb);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow-x:hidden;padding-top:64px;user-select:none}
.nav{position:fixed;top:0;left:0;right:0;z-index:40;padding:12px 16px;background:rgba(255,255,255,.8);backdrop-filter:blur(12px);border-bottom:1px solid #fce7f3;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.navin{max-width:448px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}.badge{display:flex;align-items:center;gap:6px;background:#fff1f2;border:1px solid #fecdd3;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:700;color:#881337;box-shadow:0 1px 2px rgba(0,0,0,.04)}.badge .spark{color:#f43f5e;animation:spin 3s linear infinite}
.navbtns{display:flex;align-items:center;gap:6px}.iconbtn{padding:8px;border-radius:999px;background:rgba(252,231,243,.8);color:#9f1239;box-shadow:0 1px 2px rgba(0,0,0,.04)}.mapbtn{padding:7px 10px;border-radius:999px;background:#f43f5e;color:white;font-weight:700;font-size:12px;display:flex;gap:5px;align-items:center}

footer{padding:8px;text-align:center;font-size:12px;color:#fb7185;font-weight:600;z-index:10}
.scene{display:flex;flex-direction:column;align-items:center;justify-content:space-between;min-height:78vh;width:100%;padding:16px;max-width:448px;text-align:center;position:relative;overflow:hidden}.titlebox{margin-top:8px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30}.title{font-size:24px;line-height:1.2;font-weight:900;color:#881337;margin:0;letter-spacing:-.5px}.subtitle{font-size:12px;color:#be123c;font-weight:700;margin:4px 0 0}
.stage{position:relative;margin:16px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:250px}.glow{position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(251,207,232,.4);filter:blur(22px);z-index:0;transition:.7s}.glow.love{background:linear-gradient(90deg,rgba(251,113,133,.5),rgba(249,168,212,.5));filter:blur(32px);transform:scale(1.25)}
.character-wrap{position:relative;z-index:10;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;animation:bob 2.5s ease-in-out infinite}.character-wrap.excited{animation:excited .6s ease-in-out infinite}.character-wrap.annoyed{animation:shake 2.5s ease-in-out infinite}.character-wrap.shy{animation:shy 2.5s ease-in-out infinite}.character-wrap.surprised{animation:excited 2.5s ease-in-out infinite}
.character-wrap svg{width:160px;height:180px;filter:drop-shadow(0 10px 12px rgba(244,114,182,.22))}
.float-hearts{position:absolute;top:-40px;display:flex;gap:8px;pointer-events:none;z-index:5}.float-hearts span{font-size:20px;animation:heartFloat 1.3s ease-in-out infinite}.float-hearts span:nth-child(2){animation-delay:.2s;font-size:18px}.float-hearts span:nth-child(3){animation-delay:.4s;font-size:16px}
.controls{width:100%;padding-bottom:24px;z-index:40}.stack{display:flex;flex-direction:column;gap:12px;width:100%}
.primary{width:100%;padding:14px 16px;background:linear-gradient(90deg,#f43f5e,#db2777,#e11d48);color:white;font-weight:900;font-size:18px;border-radius:16px;box-shadow:0 8px 20px rgba(244,63,94,.25);border:1px solid rgba(255,255,255,.2);transition:.2s}.primary:active,.secondary:active,.cakebox:active{transform:scale(.95)}
.secondary{width:100%;padding:12px 16px;background:rgba(255,255,255,.95);border:2px solid #fda4af;color:#be123c;font-weight:800;font-size:16px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.08);transition:.2s;touch-action:none}
.no-wrap{position:relative;width:100%;display:flex;justify-content:center;align-items:center;min-height:55px}
.love-text{z-index:30;margin-bottom:16px;pointer-events:none;filter:drop-shadow(0 8px 8px rgba(0,0,0,.15));animation:popIn .45s ease-out}.love-pill{padding:10px 20px;border-radius:999px;background:linear-gradient(90deg,#e11d48,#db2777,#e11d48);color:#fff;font-weight:900;font-size:18px;box-shadow:0 10px 20px rgba(0,0,0,.14);border:2px solid rgba(255,255,255,.9);animation:pulse 1.5s infinite}
.flying{position:absolute;z-index:30;font-size:48px;animation:fly .6s ease-out forwards}.hearts-field{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}.particle-heart{position:absolute;left:50%;top:50%;font-size:24px;animation:rise 2.2s ease-out infinite}.reaction{display:inline-block;padding:4px 14px;background:rgba(255,228,230,.9);border:1px solid #fecdd3;color:#9f1239;font-size:12px;font-weight:700;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.08);animation:popIn .3s}
.cakebox{position:relative;cursor:pointer;margin-top:16px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);padding:24px;border-radius:24px;border:2px solid #fecdd3;box-shadow:0 12px 25px rgba(244,114,182,.18);display:flex;flex-direction:column;align-items:center;user-select:none;transition:.2s}.candles{display:flex;justify-content:center;gap:16px;margin-bottom:4px;position:relative;z-index:10}.candle{display:flex;flex-direction:column;align-items:center}.flame{width:16px;height:24px;background:#fbbf24;border-radius:999px;filter:blur(1px);box-shadow:0 5px 12px rgba(251,191,36,.45);display:flex;justify-content:center;align-items:center;animation:flame .5s infinite}.flame i{width:6px;height:12px;background:#ef4444;border-radius:999px}.stick{width:10px;height:32px;background:linear-gradient(#f9a8d4,#fb7185);border-radius:4px 4px 2px 2px;border-top:1px solid rgba(255,255,255,.5)}
.cake-top{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:-8px;z-index:20}.cake-top span{font-size:18px;animation:bounce 2s infinite}.cake-top span:nth-child(2){font-size:20px;animation-duration:1.6s}.cake-top span:nth-child(3){animation-duration:2.2s}.layer1{width:160px;height:40px;background:linear-gradient(90deg,#f9a8d4,#fda4af,#f9a8d4);border-radius:24px 24px 0 0;border-bottom:2px solid rgba(244,63,94,.5);display:flex;align-items:center;justify-content:space-around;position:relative;overflow:hidden}.layer1:after{content:'';position:absolute;left:0;right:0;bottom:0;height:8px;background:rgba(255,255,255,.4);border-radius:999px}.layer2{width:192px;height:64px;background:linear-gradient(90deg,#fef3c7,#fce7f3,#fef3c7);border-left:4px solid #f9a8d4;border-right:4px solid #f9a8d4;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 12px rgba(0,0,0,.08);overflow:hidden}.layer2:before{content:'';width:100%;height:12px;background:rgba(249,168,212,.4);box-shadow:inset 0 2px 3px rgba(0,0,0,.05)}.banner{position:absolute;font-weight:900;font-size:12px;color:#9f1239;background:rgba(255,255,255,.95);padding:4px 16px;border-radius:999px;box-shadow:0 4px 8px rgba(0,0,0,.08);border:2px solid #fda4af;display:flex;gap:4px;direction:ltr}.banner b{color:#f43f5e}.layer3{width:224px;height:40px;background:linear-gradient(90deg,#f9a8d4,#f472b6,#f9a8d4);border-radius:0 0 16px 16px;border-top:2px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:space-around;padding:0 16px;box-shadow:0 10px 16px rgba(0,0,0,.12)}.plate{width:256px;height:12px;background:linear-gradient(90deg,#e5e7eb,#fff,#e5e7eb);border-radius:999px;box-shadow:0 5px 10px rgba(0,0,0,.1);border:1px solid #d1d5db;margin-top:2px}.hint{margin-top:12px;font-size:11px;font-weight:800;color:#be123c;background:#ffe4e6;padding:4px 14px;border-radius:999px;border:1px solid #fecdd3;animation:pulse 1.5s infinite}.wish{background:linear-gradient(90deg,#f43f5e,#ec4899);color:white;font-weight:700;font-size:14px;padding:8px 16px;border-radius:16px;box-shadow:0 4px 10px rgba(0,0,0,.1);border:1px solid rgba(255,255,255,.3);animation:popIn .4s}.signature{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:16px;background:linear-gradient(90deg,#f43f5e,#ec4899,#e11d48);color:#fff;font-weight:900;font-size:14px;box-shadow:0 5px 12px rgba(244,114,182,.2);border:1px solid rgba(255,255,255,.3)}.messagebox{margin-top:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border:2px solid rgba(254,205,211,.9);border-radius:24px;padding:20px;box-shadow:0 12px 24px rgba(0,0,0,.12);text-align:right;max-width:320px;position:relative;overflow:hidden;animation:popIn .45s}.messagebox .spark2{position:absolute;top:8px;left:8px;color:#fecdd3}.messagebox h3{font-weight:900;color:#be123c;font-size:16px;border-bottom:1px solid #ffe4e6;padding-bottom:6px;margin:0;display:flex;align-items:center;justify-content:space-between}.messagebox h3 small{font-size:11px;font-weight:400;color:#fb7185}.messagebox p{font-size:13px;line-height:1.8;color:#374151;font-weight:500;margin:10px 0}.messagebox p.bold{font-size:14px;font-weight:800}.love-tag{display:inline-block;font-size:12px;font-weight:900;color:#e11d48;background:#fff1f2;padding:2px 10px;border-radius:999px;border:1px solid #ffe4e6;direction:ltr}.sigarea{width:100%;padding-bottom:24px;z-index:40;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.drawer{position:fixed;inset:0;z-index:50;overflow:hidden}.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px)}.drawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(384px,calc(100% - 40px));background:white;box-shadow:-10px 0 30px rgba(0,0,0,.15);display:flex;flex-direction:column;animation:slideIn .25s ease-out}.drawer-head{padding:16px;border-bottom:1px solid #ffe4e6;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#f43f5e,#ec4899);color:#fff}.drawer-head h2{margin:0;font-size:18px;font-weight:900}.drawer-head p{margin:2px 0 0;font-size:12px;color:#ffe4e6}.close{padding:6px;border-radius:999px;background:transparent;color:white}.drawer-list{flex:1;overflow:auto;padding:12px}.sceneitem{width:100%;text-align:right;padding:12px;border-radius:16px;display:flex;align-items:center;gap:12px;background:white;border:1px solid transparent;margin-bottom:8px}.sceneitem.active{background:#fff1f2;border:2px solid #fb7185;box-shadow:0 2px 4px rgba(0,0,0,.06)}.sceneicon{padding:10px;border-radius:12px;background:#f3f4f6}.active .sceneicon{background:#ffe4e6}.sceneitem strong{display:block;font-size:14px;color:#1f2937}.active strong{color:#be123c}.sceneitem small{display:block;font-size:12px;color:#6b7280;margin-top:2px}.drawer-foot{padding:16px;border-top:1px solid #f3f4f6;background:#f9fafb;text-align:center;color:#6b7280;font-size:12px;font-weight:600}
.hidden{display:none!important}
.bgfloat{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.glowbg{position:absolute;border-radius:50%;filter:blur(48px)}.g1{top:-80px;left:-80px;width:320px;height:320px;background:rgba(251,207,232,.4);animation:pulse 2s infinite}.g2{top:50%;right:-80px;width:384px;height:384px;background:rgba(249,168,212,.3)}.g3{bottom:-80px;left:33%;width:320px;height:320px;background:rgba(255,228,230,.5)}.floatitem{position:absolute;animation:floatup linear infinite;opacity:0}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes excited{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(-3deg)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-3px)}}@keyframes shy{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@keyframes heartFloat{0%,100%{transform:translateY(-4px) scale(.9);opacity:.6}50%{transform:translateY(-14px) scale(1.2);opacity:1}}@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}@keyframes popIn{from{opacity:0;transform:scale(.8) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}@keyframes fly{from{transform:translateY(80px) scale(.6);opacity:1}to{transform:translateY(-30px) scale(2);opacity:0}}@keyframes rise{0%{transform:translate(-50%,80px) scale(.5);opacity:0}20%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),var(--y)) scale(1);opacity:0}}@keyframes flame{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.2) translateY(-2px)}}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes floatup{0%{transform:translateY(105vh) translateX(0) rotate(0);opacity:0}15%{opacity:.8}80%{opacity:.8}100%{transform:translateY(-10vh) translateX(var(--sway)) rotate(0);opacity:0}}@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}@media(max-width:430px){.badge{font-size:11px;padding:6px 10px}.title{font-size:21px}.primary{font-size:17px}.character-wrap svg{width:150px;height:169px}.cakebox{padding:20px}.layer3{width:215px}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bgfloat" id="bgfloat">
    <div class="glowbg g1"></div><div class="glowbg g2"></div><div class="glowbg g3"></div>
  </div>
  <header class="nav">
    <div class="navin">
      <div class="badge"><span class="spark">✦</span><span>هدية عيد ميلادك من يوسفيي ❤️</span></div>
      <div class="navbtns">
        <button class="iconbtn" id="soundBtn" title="كتم الصوت" aria-label="Toggle Sound">🔊</button>
        <button class="mapbtn" id="mapBtn" title="خريطة المشاهد">☷ <span>المشاهد</span></button>
      </div>
    </div>
  </header>
  <main id="main"></main>
  <footer>Happy Birthday Rahouma 🎉</footer>
</div>

<div id="drawer" class="drawer hidden">
  <div class="backdrop" id="backdrop"></div>
  <div class="drawer-panel">
    <div class="drawer-head"><div><h2>قائمة المشاهد 🎉</h2><p>تنقلي بين المشاهد براحتك</p></div><button class="close" id="closeDrawer">✕</button></div>
    <div class="drawer-list">
      <button class="sceneitem" data-scene="kiss1"><div class="sceneicon">♥</div><div><strong>البوسة 😘</strong><small>البداية والشقاوة</small></div></button>
      <button class="sceneitem" data-scene="cake"><div class="sceneicon">🎂</div><div><strong>تورتة عيد الميلاد 🎂</strong><small>اطفي الشمع وتمني أمنية</small></div></button>
      <button class="sceneitem" data-scene="message"><div class="sceneicon">✉</div><div><strong>الرسالة 💌</strong><small>الجواب للغالية</small></div></button>
    </div>
    <div class="drawer-foot">عيد ميلاد سعيد لرحومة 🎉</div>
  </div>
</div>

<script>
const state={scene:'kiss1',muted:false,emotion:'normal',stage:'initial',flying:false,love:false,fleeCount:0,fleeX:0,fleeY:0,reaction:null,candles:true,wish:false,letter:false};
const reactions=[
['إيه ده؟ بتخلعي ليه؟ 😂','surprised'],['يا باردة هاتي بوسة واخلصي 😒','annoyed'],['خخخخ هاتي بوووسه يخراا 😡','annoyed'],['منا هاخد بوسة يعني هاخد بوسة 😤','annoyed'],['متعصبنيييييش يعم فتحيي 😠','annoyed'],['وعلى إيه العند ده بس؟ 😜','shy'],['وراكي وراكي مش هسيبك 😜','excited'],['يا بنتي العند ده هيوديكي فين؟ 🤦‍♂️','annoyed'],['رحومة اخلصي بقى متبقيش رخمة 😂','shy'],['طب وحياة عندك هاخدها برضه 😜','excited']
];
function esc(s){return s}
function iconCharacter(emotion){
 let eyes='', mouth='';
 if(emotion==='shy') eyes='<path d="M 58 92 Q 65 85 72 92" fill="none" stroke="#4A1525" stroke-width="3.5" stroke-linecap="round"/><path d="M 88 92 Q 95 85 102 92" fill="none" stroke="#4A1525" stroke-width="3.5" stroke-linecap="round"/>';
 else if(emotion==='surprised') eyes='<circle cx="64" cy="92" r="7" fill="#4A1525"/><circle cx="66" cy="90" r="2.5" fill="#fff"/><circle cx="96" cy="92" r="7" fill="#4A1525"/><circle cx="98" cy="90" r="2.5" fill="#fff"/>';
 else if(emotion==='annoyed') eyes='<path d="M 58 88 L 70 92" stroke="#4A1525" stroke-width="3.5" stroke-linecap="round"/><path d="M 102 88 L 90 92" stroke="#4A1525" stroke-width="3.5" stroke-linecap="round"/><circle cx="64" cy="95" r="4" fill="#4A1525"/><circle cx="96" cy="95" r="4" fill="#4A1525"/>';
 else if(emotion==='excited') eyes='<path d="M 58 90 Q 64 82 70 90" fill="none" stroke="#4A1525" stroke-width="4" stroke-linecap="round"/><path d="M 90 90 Q 96 82 102 90" fill="none" stroke="#4A1525" stroke-width="4" stroke-linecap="round"/>';
 else if(emotion==='blowing') eyes='<path d="M 58 92 Q 64 87 70 92" fill="none" stroke="#4A1525" stroke-width="3.5" stroke-linecap="round"/><path d="M 90 92 Q 96 87 102 92" fill="none" stroke="#4A1525" stroke-width="3.5" stroke-linecap="round"/>';
 else eyes='<circle cx="64" cy="92" r="5" fill="#4A1525"/><circle cx="66" cy="90" r="1.8" fill="#fff"/><circle cx="96" cy="92" r="5" fill="#4A1525"/><circle cx="98" cy="90" r="1.8" fill="#fff"/>';
 if(emotion==='annoyed') mouth='<path d="M 74 108 Q 80 104 86 108" fill="none" stroke="#4A1525" stroke-width="3" stroke-linecap="round"/>';
 else if(emotion==='surprised'||emotion==='excited') mouth='<ellipse cx="80" cy="108" rx="5" ry="7" fill="#E6004C"/>';
 else if(emotion==='blowing') mouth='<circle cx="80" cy="107" r="4" fill="#4A1525"/>';
 else mouth='<path d="M 73 103 Q 80 110 87 103" fill="none" stroke="#4A1525" stroke-width="2.8" stroke-linecap="round"/>';
 let cheeks=['shy','surprised','excited','holding_heart'].includes(emotion)?'<ellipse cx="56" cy="104" rx="9" ry="6" fill="#FF6B8B" opacity=".6"/><ellipse cx="104" cy="104" rx="9" ry="6" fill="#FF6B8B" opacity=".6"/>':'';
 let item=emotion==='holding_heart'?'<path d="M 80 135 C 70 120, 60 130, 80 148 C 100 130, 90 120, 80 135 Z" fill="#E6004C"/><circle cx="60" cy="135" r="7" fill="#fff" stroke="#FFB6C1" stroke-width="2"/><circle cx="100" cy="135" r="7" fill="#fff" stroke="#FFB6C1" stroke-width="2"/>':emotion==='holding_rose'?'<path d="M 80 155 Q 85 135 90 125" fill="none" stroke="#166534" stroke-width="3" stroke-linecap="round"/><path d="M 88 138 Q 94 135 90 142" fill="#22C55E"/><circle cx="90" cy="122" r="8" fill="#E6004C"/><circle cx="88" cy="120" r="4" fill="#FF4D79"/><circle cx="62" cy="140" r="7" fill="#fff" stroke="#FFB6C1" stroke-width="2"/><circle cx="98" cy="140" r="7" fill="#fff" stroke="#FFB6C1" stroke-width="2"/>':'<circle cx="50" cy="130" r="7" fill="#fff" stroke="#FFB6C1" stroke-width="2"/><circle cx="110" cy="130" r="7" fill="#fff" stroke="#FFB6C1" stroke-width="2"/>';
 let hearts=['shy','excited','surprised','holding_heart'].includes(emotion)?'<div class="float-hearts"><span>❤️</span><span>💖</span><span>💕</span></div>':'';
 let cls='character-wrap '+emotion;
 return hearts+`<div class="${cls}"><svg width="160" height="180" viewBox="0 0 160 180" fill="none" xmlns="http://www.w3.org/2000/svg">
 <ellipse cx="80" cy="170" rx="50" ry="8" fill="#f472b6" fill-opacity=".25"/>
 <path d="M 50 65 C 30 10, 20 20, 42 70" fill="#FFF0F5" stroke="#FFB6C1" stroke-width="4" stroke-linecap="round"/><path d="M 46 62 C 34 25, 28 30, 42 66" fill="#FFC0CB" opacity=".6"/>
 <path d="M 110 65 C 130 10, 140 20, 118 70" fill="#FFF0F5" stroke="#FFB6C1" stroke-width="4" stroke-linecap="round"/><path d="M 114 62 C 126 25, 132 30, 118 66" fill="#FFC0CB" opacity=".6"/>
 <path d="M 45 120 C 45 100, 115 100, 115 120 C 125 155, 35 155, 45 120 Z" fill="#FFF0F5" stroke="#FFB6C1" stroke-width="4"/>
 <circle cx="80" cy="95" r="45" fill="#fff" stroke="#FFB6C1" stroke-width="4"/>
 ${cheeks}${eyes}<ellipse cx="80" cy="98" rx="2.5" ry="2" fill="#FF8DA1"/>${mouth}${item}</svg></div>`;
}
function playTone(type='pop'){
 if(state.muted)return; try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain(),n=c.currentTime;
  o.type=type==='fan'?'triangle':'sine';o.frequency.value=type==='kiss'?700:type==='fan'?523:400;g.gain.setValueAtTime(.22,n);g.gain.exponentialRampToValueAtTime(.01,n+.12);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+.12);
 }catch(e){}
}
function speak(text,lang='en-US'){if(state.muted)return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.95;u.pitch=1.25;speechSynthesis.speak(u)}catch(e){}}
function confetti(){
 for(let i=0;i<55;i++){let x=Math.random()*100,y=30+Math.random()*35;let d=document.createElement('i');d.style.cssText=`position:fixed;left:${x}%;top:${y}%;width:7px;height:10px;background:${['#ff0055','#ff6699','#ffcc00','#fff','#00ccff'][i%5]};z-index:100;pointer-events:none;transform:rotate(${Math.random()*360}deg);animation:conf .9s ease-out forwards`;document.body.appendChild(d);setTimeout(()=>d.remove(),1000)}
}
const extraStyle=document.createElement('style');extraStyle.textContent='@keyframes conf{to{transform:translate('+0+'px, 220px) rotate(720deg);opacity:0}}';document.head.appendChild(extraStyle);
function bgParticles(){const el=document.getElementById('bgfloat');const types=['💖','✨','🌹','💕','🌸','💖','✨','🫧'];for(let i=0;i<18;i++){let s=document.createElement('div');s.className='floatitem';s.textContent=types[i%types.length];s.style.left=(Math.floor(Math.random()*92)+4)+'%';s.style.fontSize=(Math.floor(Math.random()*14)+14)+'px';s.style.animationDuration=(Math.random()*8+10)+'s';s.style.animationDelay=(Math.random()*8)+'s';s.style.setProperty('--sway',(Math.random()*40-20)+'px');el.appendChild(s)}}bgParticles();
function render(){
 const main=document.getElementById('main');
 if(state.scene==='kiss1') main.innerHTML=kissHTML();
 else if(state.scene==='cake') main.innerHTML=cakeHTML();
 else main.innerHTML=messageHTML();
 bind();
 updateDrawer();
}
function sceneBase(inner){return `<div class="scene">${inner}</div>`}
function kissHTML(){return sceneBase(`
<div class="titlebox">${state.stage==='initial'?'<h1 class="title">رحومة.. هاتي بوسة سريعة كده 😘</h1>':''}${state.reaction&&state.stage==='initial'?`<span class="reaction">${state.reaction}</span>`:''}</div>
<div class="stage"><div class="glow ${state.love?'love':''}"></div>${state.love?'<div class="love-text"><div class="love-pill">كنت عارف انك هتديني بوووسه هععععع 😜</div></div>':''}${iconCharacter(state.emotion)}${state.flying?'<div class="flying">😘</div>':''}${state.love?'<div class="hearts-field">'+Array.from({length:12},(_,i)=>`<span class="particle-heart" style="--x:${(i%2===0?1:-1)*(Math.random()*110+30)}px;--y:${-110-Math.random()*60}px;animation-delay:${i*.15}s">${i%3===0?'❤️':i%3===1?'💖':'✨'}</span>`).join('')+'</div>':''}</div>
<div class="controls">${state.stage==='initial'?`<div class="stack"><button class="primary" id="kiss">خد بوسة 😘</button><div class="no-wrap"><button class="secondary" id="no" style="transform:translate(${state.fleeX}px,${state.fleeY}px)">لأ مش هديك 😂</button></div></div>`:`<button class="primary" id="nextCake">يلا بينا على التورتة 🎂</button>`}</div>`)}
function cakeHTML(){return sceneBase(`
<div class="titlebox"><h1 class="title">${state.candles?'اطفي الشمع وتمني أمنية يا رحومة 🎂':'كل سنة وأنتي طيبة يا أحلى رحومة 🎉'}</h1><p class="subtitle">${state.candles?'دوسي على التورتة عشان تطفي الشمع 💨':'يا رب تكون سنة سكر عليكي وتحققي كل أحلامك ✨'}</p></div>
<div class="stage">${iconCharacter(state.candles?'normal':state.emotion)}<div class="cakebox" id="cakebox"><div class="candles">${[1,2,3].map(i=>`<div class="candle">${state.candles?'<div class="flame"><i></i></div>':''}<div class="stick"></div></div>`).join('')}</div><div class="cake-top"><span>🍓</span><span>🎂</span><span>🍓</span></div><div class="layer1"><span>✨</span><span>🍓</span><span>✨</span></div><div class="layer2"><div class="banner"><b>❤️</b><span>Love You Rahouma</span><b>❤️</b></div></div><div class="layer3"><span>🍒</span><span>✨</span><span>🍓</span><span>✨</span><span>🍒</span></div><div class="plate"></div>${state.candles?'<div class="hint">دوسي هنا عشان تطفي الشمع 💨</div>':''}</div></div>
${state.wish?'<div class="wish">سنة حلوة يا جميل وعقبال 100 سنة 🎉</div>':''}
<div class="controls">${!state.candles?'<button class="primary" id="nextMessage">افتحي الرسالة 💌</button>':''}</div>`)}
function messageHTML(){return sceneBase(`
<div class="titlebox"><h1 class="title">جواب مخصوص لرحومة 💌</h1><p class="subtitle">${state.letter?'اقرأي الرسالة دي من قلبي':'افتحي الجواب وشوفي المكتوب ليكي ✨'}</p></div>
<div class="stage">${iconCharacter(state.letter?'holding_heart':'normal')}${!state.letter?'<button class="primary" id="openLetter" style="margin-top:16px;width:auto;padding:20px 32px;font-size:18px">✉<span>افتحي الرسالة 💌</span></button>':`<div class="messagebox"><div class="spark2">✦</div><h3><span>أحلى رحومة فى الدنيا 💕</span><small>Happy Birthday</small></h3><p class="bold">كل سنة وأنتي طيبة يا رحومة! 🎉</p><p>يارب تكون سنة حلوة عليكي وتبقي مبسوطة ومرتاحة وتحققي كل اللي نفسك فيه دايماً.</p><p>ربنا يفرح قلبك ويديكي الصحة والعافية ويفضل حسك في الدنيا دايماً. ❤️</p><div style="text-align:left;padding-top:6px;border-top:1px solid #ffe4e6"><span class="love-tag">Love You So Much ❤️</span></div></div>`}</div>
<div class="sigarea"><div class="signature"><span>هدية عيد ميلادك من يوسفيي ❤️</span></div>${state.letter?'<button class="secondary" id="restart"><span>↻</span><span>جربي تاني يجلبييي 🔄</span></button>':''}</div>`)}
function bind(){
 document.getElementById('kiss')?.addEventListener('click',kiss);
 const no=document.getElementById('no'); if(no){['mouseenter','touchstart','click'].forEach(ev=>no.addEventListener(ev,e=>{e.preventDefault();flee()}))}
 document.getElementById('nextCake')?.addEventListener('click',()=>{playTone();state.scene='cake';render()});
 document.getElementById('cakebox')?.addEventListener('click',blow);
 document.getElementById('nextMessage')?.addEventListener('click',()=>{playTone();state.scene='message';render()});
 document.getElementById('openLetter')?.addEventListener('click',()=>{playTone('fan');state.letter=true;render()});
 document.getElementById('restart')?.addEventListener('click',()=>{playTone();state.scene='kiss1';state.emotion='normal';state.stage='initial';state.fleeCount=0;state.reaction=null;state.love=false;render()});
}
function kiss(){if(state.stage!=='initial')return;playTone('kiss');state.stage='kissing';state.flying=true;state.emotion='surprised';confetti();render();setTimeout(()=>{state.flying=false;state.emotion='excited';state.love=true;render();setTimeout(()=>{state.stage='completed';render()},1400)},600)}
function flee(){if(state.stage!=='initial')return;playTone();let r=reactions[state.fleeCount%reactions.length];state.emotion=r[1];state.reaction=r[0];state.fleeCount++;state.fleeX=(Math.random()-.5)*180;state.fleeY=(Math.random()-.5)*80;render()}
function blow(){if(!state.candles)return;playTone();state.emotion='blowing';render();setTimeout(()=>{state.candles=false;state.emotion='excited';state.wish=true;confetti();render()},600)}
function updateDrawer(){document.querySelectorAll('.sceneitem').forEach(b=>{b.classList.toggle('active',b.dataset.scene===state.scene)});}
document.getElementById('soundBtn').onclick=()=>{state.muted=!state.muted;document.getElementById('soundBtn').textContent=state.muted?'🔇':'🔊';document.getElementById('soundBtn').title=state.muted?'تشغيل الصوت':'كتم الصوت'};
document.getElementById('mapBtn').onclick=()=>document.getElementById('drawer').classList.remove('hidden');
document.getElementById('closeDrawer').onclick=()=>document.getElementById('drawer').classList.add('hidden');
document.getElementById('backdrop').onclick=()=>document.getElementById('drawer').classList.add('hidden');
document.querySelectorAll('.sceneitem').forEach(b=>b.onclick=()=>{state.scene=b.dataset.scene;document.getElementById('drawer').classList.add('hidden');render()});
render();
</script>
</body>
</html>
